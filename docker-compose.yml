version: '3.8'

services:
  raft-node-1:
    image: python:3.11-slim
    container_name: swarm-raft-1
    command: python raft_node_agent.py --node-id 1
    volumes:
      - ./:/workspace
    working_dir: /workspace

  raft-node-2:
    image: python:3.11-slim
    container_name: swarm-raft-2
    command: python raft_node_agent.py --node-id 2
    volumes:
      - ./:/workspace
    working_dir: /workspace

  raft-node-3:
    image: python:3.11-slim
    container_name: swarm-raft-3
    command: python raft_node_agent.py --node-id 3
    volumes:
      - ./:/workspace
    working_dir: /workspace
